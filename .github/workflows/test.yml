name: Lua tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1
      - run: luac5.1 -p ScrapKeeper/*.lua tests/run.lua
      - run: lua5.1 tests/run.lua
